services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Remove external port exposure in production
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d multiplayer_game"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
      # Добавляем аргументы для ускорения сборки
      args:
        - BUILDKIT_INLINE_CACHE=1
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${PORT}
      STORAGE_TYPE: ${STORAGE_TYPE}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSL: ${DB_SSL}
    # Remove external port exposure in production - accessed via nginx proxy
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./server/migrations:/app/migrations:ro
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      # Добавляем аргументы для ускорения сборки
      args:
        - BUILDKIT_INLINE_CACHE=1
        - VITE_API_BASE_URL=${VITE_API_BASE_URL}
        - VITE_API_WS_URL=${VITE_API_WS_URL}
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
      VITE_API_WS_URL: ${VITE_API_WS_URL}
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  default:
    driver: bridge